name: Hass Proxy
version: 1.0
panel_icon: "mdi:access-point-check"
panel_title: HassProxy
slug: hass-proxy
description: Proxy addon for internal stuff
url: "https://github.com/hieulq/hass-proxy"
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:3000]/"
watchdog: "http://[HOST]:[PORT:3000]/"
ingress: true
ingress_port: 3000
ingress_entry: /
panel_admin: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Web interface (not required for Home Assistant Ingress)
host_network: false
devices: []
usb: false
tmpfs: false
full_access: false
environment: {}
options:
  server: "http://grafana.local:3000"
  proxy_pass_host: true
  proxy_pass_real_ip: true
schema:
  server: "match(^https?://.+:\\d+$)"
  proxy_pass_host: bool
  proxy_pass_real_ip: bool
services: []
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map: []
